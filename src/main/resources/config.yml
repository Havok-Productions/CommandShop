##########################################################
#                    CommandShop                         #
##########################################################

# Existing ScoreboardChatShop prices.db, stats.db, config.yml and
# messages.yml files are copied automatically on first startup.

Minimal_Sell_Autocomplete: true
Recent_Purchase_Limit: 45

Aliases:
  COBBLESTONE:
    - cobble
  OAK_PRESSURE_PLATE:
    - pressure_plate
    - pressureplate
  STONE_PRESSURE_PLATE:
    - stonepressureplate

# Only configured and available buy items appear in a GUI category.
# Any buy item not recognized below is placed in Other automatically.
Category_Overrides:
  Food_And_Crops: []
  Materials: []
  Ores: []
  Other: []

# Patterns use a leading * as a suffix match. A material is displayed
# under the first matching group. Groups with no available buy items
# are hidden automatically.
Material_Groups:
  Stairs:
    icon: OAK_STAIRS
    patterns: ["*_STAIRS"]
  Planks:
    icon: OAK_PLANKS
    patterns: ["*_PLANKS"]
  Wool:
    icon: WHITE_WOOL
    patterns: ["*_WOOL"]
  Logs:
    icon: OAK_LOG
    patterns: ["*_LOG", "*_WOOD", "*_STEM", "*_HYPHAE"]
  Slabs:
    icon: OAK_SLAB
    patterns: ["*_SLAB"]
  Fences:
    icon: OAK_FENCE
    patterns: ["*_FENCE"]
  Fence Gates:
    icon: OAK_FENCE_GATE
    patterns: ["*_FENCE_GATE"]
  Doors:
    icon: OAK_DOOR
    patterns: ["*_DOOR"]
  Trapdoors:
    icon: OAK_TRAPDOOR
    patterns: ["*_TRAPDOOR"]
  Buttons:
    icon: OAK_BUTTON
    patterns: ["*_BUTTON"]
  Pressure Plates:
    icon: OAK_PRESSURE_PLATE
    patterns: ["*_PRESSURE_PLATE"]
  Walls:
    icon: COBBLESTONE_WALL
    patterns: ["*_WALL"]
  Carpets:
    icon: WHITE_CARPET
    patterns: ["*_CARPET"]
  Terracotta:
    icon: TERRACOTTA
    patterns: ["TERRACOTTA", "*_TERRACOTTA"]
  Concrete:
    icon: WHITE_CONCRETE
    patterns: ["*_CONCRETE"]
  Concrete Powder:
    icon: WHITE_CONCRETE_POWDER
    patterns: ["*_CONCRETE_POWDER"]
  Glass Panes:
    icon: GLASS_PANE
    patterns: ["GLASS_PANE", "*_STAINED_GLASS_PANE"]

VERSION: 2
