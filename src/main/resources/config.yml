##########################################################
#                    CommandShop                         #
##########################################################

# Existing ScoreboardChatShop prices.db, stats.db, config.yml and
# messages.yml files are copied automatically on first startup.

Minimal_Sell_Autocomplete: true
Recent_Purchase_Limit: 45

# Every /setprice and price-removal action is appended to
# price-history.yml with its actor, timestamp, old value, and new value.
Price_History:
  Max_Entries: 10000

# A player's sales for one material must first cross the revenue and
# revenue-to-sale-price thresholds inside the rolling window. The normal
# detector then requires a profitable known direct-buy or recursive crafting
# path. The extreme-volume fallback can flag an enormous monetary multiple even
# when no complete acquisition cost is known. For example, $10,000 earned from
# an item with a $35 configured unit sell price is 285.71x and exceeds the
# default 100x extreme threshold.
Abuse_Detection:
  Enabled: true
  Window_Minutes: 30
  Minimum_Item_Revenue: 5000.0
  Minimum_Revenue_To_Sale_Price_Ratio: 2.0
  Minimum_Profit_Ratio: 1.10
  Minimum_Extreme_Volume_Ratio: 100.0

Aliases:
  COBBLESTONE:
    - cobble
  OAK_PRESSURE_PLATE:
    - pressure_plate
    - pressureplate
  STONE_PRESSURE_PLATE:
    - stonepressureplate

# Only configured and available buy items appear in a GUI category.
# CommandShop automatically sorts food/crops, ores and mineral storage,
# all remaining placeable blocks, crafting materials, and true "other"
# items. Overrides below take priority over the automatic category.
Category_Overrides:
  Food_And_Crops: []
  Materials: []
  Ores: []
  Other: []

# Patterns use a leading * as a suffix match. A material is displayed
# under the first matching group. Groups with no available buy items
# are hidden automatically.
Material_Groups:
  Stairs:
    icon: OAK_STAIRS
    patterns: ["*_STAIRS"]
  Planks:
    icon: OAK_PLANKS
    patterns: ["*_PLANKS"]
  Wool:
    icon: WHITE_WOOL
    patterns: ["*_WOOL"]
  Logs:
    icon: OAK_LOG
    patterns: ["*_LOG", "*_WOOD", "*_STEM", "*_HYPHAE"]
  Slabs:
    icon: OAK_SLAB
    patterns: ["*_SLAB"]
  Fences:
    icon: OAK_FENCE
    patterns: ["*_FENCE"]
  Fence Gates:
    icon: OAK_FENCE_GATE
    patterns: ["*_FENCE_GATE"]
  Doors:
    icon: OAK_DOOR
    patterns: ["*_DOOR"]
  Trapdoors:
    icon: OAK_TRAPDOOR
    patterns: ["*_TRAPDOOR"]
  Buttons:
    icon: OAK_BUTTON
    patterns: ["*_BUTTON"]
  Pressure Plates:
    icon: OAK_PRESSURE_PLATE
    patterns: ["*_PRESSURE_PLATE"]
  Walls:
    icon: COBBLESTONE_WALL
    patterns: ["*_WALL"]
  Carpets:
    icon: WHITE_CARPET
    patterns: ["*_CARPET"]
  Terracotta:
    icon: TERRACOTTA
    patterns: ["TERRACOTTA", "*_TERRACOTTA"]
  Concrete:
    icon: WHITE_CONCRETE
    patterns: ["*_CONCRETE"]
  Concrete Powder:
    icon: WHITE_CONCRETE_POWDER
    patterns: ["*_CONCRETE_POWDER"]
  Glass Panes:
    icon: GLASS_PANE
    patterns: ["GLASS_PANE", "*_STAINED_GLASS_PANE"]

VERSION: 2
