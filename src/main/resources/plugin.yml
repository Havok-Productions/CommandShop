name: CommandShop
version: "${project.version}"
main: me.thetealviper.commandshop.CommandShop
api-version: "1.19"
folia-supported: true
author: yomamaeatstoes
description: Organized GUI and command shop for Vault economies
depend: [Vault]
softdepend: [PlaceholderAPI, PlugMan, PlugManX]

commands:
  commandshop:
    description: Open, reload, inspect, or delete CommandShop prices
    usage: /commandshop [reload|delete <item>|inspect <username>]
    aliases: [cshop]
  shop-gui:
    description: Open the main shop GUI
    usage: /shop-gui
  buy-gui:
    description: Open the organized buy GUI
    usage: /buy-gui
  sell-gui:
    description: Open the drag-to-sell GUI
    usage: /sell-gui
  shop:
    description: Open the shop or view legacy player shop statistics
    usage: /shop [inspect <username>|remove <item>]
  buy:
    description: Open the buy GUI or buy a priced item
    usage: /buy [remove <item>|item [amount|max]]
  sell:
    description: Open the sell GUI or sell a priced item
    usage: /sell [remove <item>|item [amount|max]]
  price:
    description: Display buy and sell prices
    usage: /price <item|hand> [amount]
  setprice:
    description: Configure a buy or sell bundle price
    usage: /setprice <buy|sell> <item|hand> <price> [amount]
    permission: commandshop.admin

permissions:
  commandshop.use:
    description: Use CommandShop and its GUIs
    default: true
  commandshop.inspect:
    description: Inspect another player's top shop transactions
    default: op
  commandshop.admin:
    description: Change CommandShop prices
    default: op
